[package]
name = "sop"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
# Pinned to git for `PyFrozenDict`, which is merged but unreleased: 0.29.2
# exposes only the raw `PyFrozenDict_New` FFI item, which costs the reader,
# the writer and module init an unsafe block each. Back to a version
# requirement once 0.30 is out.
pyo3 = { git = "https://github.com/PyO3/pyo3", rev = "51dcc7dbd30db78953ba6b190bec97a115af7d76" }
unicode-ident = "1.0.24"

[features]
# Enabled only by maturin (see pyproject.toml); with it always on, plain
# `cargo check` and `cargo test` fail to link against libpython.
extension-module = ["pyo3/extension-module"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# `err_at` and `refuse_tagged_symbol` take `&self` to read as methods next to
# the siblings they delegate for; as associated functions they would only add
# a type name at every call site.
unused_self = "allow"
