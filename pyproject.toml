[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "sop"
# The version is single-sourced from Cargo.toml.
dynamic = ["version"]
description = "The sop interchange format: a Rust core with a Python SDK"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.15"

[tool.maturin]
module-name = "sop._core"
python-source = "python"
# Turns on pyo3/extension-module for maturin builds only, so plain cargo
# commands (cargo test, cargo check) still link.
features = ["extension-module"]

[dependency-groups]
dev = [
    "hypothesis",
    "maturin",
    "mypy",
    "pyrefly",
    "pyright",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# The typing corpus writes the older spellings on purpose -- `Optional`,
# `Union`, an explicit `TypeAliasType`, a quoted annotation -- because they are
# what it is there to check.  Rewriting them to the modern ones would delete
# the cases.
"tests/typing_corpus.py" = ["UP007", "UP037", "UP040", "UP045"]

[tool.mypy]
# The tests as strictly as the package.  This project is about reading types,
# so a type error in its own suite is noise standing exactly where a real one
# would: the suite is held clean so that anything mypy says about it is worth
# reading.
files = ["python/sop", "tests"]
mypy_path = "tests"  # the suite's modules import each other by bare name
strict = true
# `tests/typing_corpus.py` is checked by mypy just as strictly, but by
# `tests/test_typing.py` rather than here: two of its lines are diagnostics
# the corpus expects and pins, which this gate could only call a failure.
# Excluded rather than ignored, because a file named on the command line is
# checked regardless -- which is how `test_typing.py` asks for it.
exclude = ["tests/typing_corpus\\.py$"]

[[tool.mypy.overrides]]
# ...and reached through `test_typing.py`'s import of it, which `exclude`
# does not stop.  Still type checked, so what that module makes of the corpus
# is still checked; only the corpus's own diagnostics are left to it.
module = "typing_corpus"
follow_imports = "silent"

[tool.pyright]
include = ["python/sop"]
typeCheckingMode = "strict"
# Named rather than inferred: without these pyright resolves whichever
# interpreter it finds first, and reports the 3.12+ syntax and the 3.15
# builtins as errors unless it happens to be run inside the activated venv.
pythonVersion = "3.15"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "--cov=sop --cov-branch --cov-fail-under=100 --cov-report=term-missing"
